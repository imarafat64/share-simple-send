<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Shyfto - Secure File Sharing Made Simple | Upload & Share Instantly</title>
    <meta name="title" content="Shyfto - Secure File Sharing Made Simple | Upload & Share Instantly" />
    <meta name="description" content="Share large files instantly with Shyfto. Secure, fast file sharing with password protection and no registration required. Upload up to 2GB per file with Pro." />
    <meta name="keywords" content="file sharing, send large files, secure file transfer, share files online, cloud storage, file upload, encrypted file sharing" />
    <meta name="author" content="Shyfto" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shyfto.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shyfto.com/" />
    <meta property="og:title" content="Shyfto - Secure File Sharing Made Simple" />
    <meta property="og:description" content="Share large files instantly with Shyfto. Secure, fast file sharing with password protection and no registration required." />
    <meta property="og:image" content="https://shyfto.com/favicon.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Shyfto" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shyfto.com/" />
    <meta name="twitter:title" content="Shyfto - Secure File Sharing Made Simple" />
    <meta name="twitter:description" content="Share large files instantly with Shyfto. Secure, fast file sharing with password protection." />
    <meta name="twitter:image" content="https://shyfto.com/favicon.png" />
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Structured Data -->

      "offers": {
        "@type": "AggregateOffer",

        "highPrice": "5",

      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1250",

        "Secure file upload",

    <script type="application/ld+json">
